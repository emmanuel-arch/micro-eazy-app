<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Micro Eazy — Quick loans. Better living.</title>
    <meta name="description" content="Verify once, apply, and repay from your phone. Every decision explained." />

    <!-- The tab and home-screen marks. The manifest icons are injected by
         vite-plugin-pwa; these are the ones the browser chrome itself uses. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/micro-eazy/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/micro-eazy/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/micro-eazy/apple-touch-icon.png" />
    <!-- Painted by the theme script below and kept current by lib/theme.tsx. -->
    <meta name="theme-color" content="#012863" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ── THE INSTALLED NAME IS EXACTLY "Micro Eazy" ────────────────────────
         The manifest's name and short_name already say so, and that is what
         Android reads. iOS does not: Safari names a home-screen shortcut from
         THIS tag, and falls back to the <title> when it is absent. The title
         above carries the tagline for the browser tab and for search, so
         without this line an iPhone would label the icon "Micro Eazy — Quick
         loans. Bet…" — a truncated sentence under an app icon.

         Keep this in step with the manifest short_name in vite.config.ts. -->
    <meta name="apple-mobile-web-app-title" content="Micro Eazy" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!--
      THE ANTI-FLASH SCRIPT. This runs before the bundle and before first paint,
      so a dark-mode phone never sees a white rectangle. It duplicates a few
      lines of lib/theme.tsx on purpose: the module cannot run this early, and a
      flash of the wrong theme is the most visible possible bug on a phone at
      night. Keep the storage key and the two colours in step with that module.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("me.theme");
          // LIGHT is the default — only an explicit "dark", or an explicit
          // "system" on a dark handset, paints dark. An unset value is light,
          // which is what makes the splash white on first run. Keep in step
          // with DEFAULT_CHOICE in src/lib/theme.tsx.
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#04060e" : "#012863");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
